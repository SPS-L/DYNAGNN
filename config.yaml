# Configuration for DYNAGNN scripts.

dynagnn:
  version: 1.2

dynawo:
  path: "path to myEnvDynawo.sh"

data:
  path: "path to data folder"

simulation:
  event_time: 
  initialization_duration:  # total Dynawo run time (s) per OP before contingency simulations, to find a steady state solution for the initial operating point

network:
  country_filter: []

kpi:
  window_sec: 
  step_sec: 
  class_bins:
    voltage:
      cuts:  # raw KPI thresholds (ascending), e.g. [1e-6, 2.25e-5, 3e-4, 5.625e-4]
    spower:
      cuts:  # raw KPI thresholds (ascending)

model:
  num_classes: 

training:
  epochs:
  patience:
  batch_size:
  split_mode:
  seed:
  training:
  validation:
  testing:

  # Fixed loss construction and output-decoding settings.
  pair_aware:
    classification_weight: 
    regression_weight:  
    inactive_gate_weight: 
    flag_gate_weight:  # BCE for flag class K-1 (disconnected/controlled)
    ordinal_weight: 
    class_weight_mode: 
    inactive_gate_pos_weight_mode: 
    flag_gate_pos_weight_mode:  # none | balanced
    flag_pos_weight_multiplier:  # scales balanced flag-gate pos_weight
    inactive_gate_threshold:  # initial decode threshold (used only for end-of-trial calibration start / diagnostics)
    flag_gate_threshold:  # initial decode threshold for flag class K-1
    # End-of-trial joint val sweep on min-val-loss checkpoint → Optuna objective + checkpoint thresholds (not re-swept on retrain)
    threshold_calibration:
      inactive_gate_low: 
      inactive_gate_high:
      inactive_gate_step:
      flag_gate_low: 
      flag_gate_high: 
      flag_gate_step: 
    epsilon: 
    selection_output: 
    # Validation score for Optuna / early stopping (protection_selection_score)
    selection_score:
      balanced_accuracy: 
      macro_f1: 
      accuracy: 
      within_one: 
      flag_recall: 

optuna:
  n_trials:
  study_name:  # folder under data/training/ and data/model/
  hparams:
    hidden_dim:
      type: categorical
      choices: 
    node_id_dim:
      type: categorical
      choices: 
    contingency_id_dim:
      type: categorical
      choices: 
    type_dim:
      type: categorical
      choices: 
    pair_dim:
      type: categorical
      choices: 
    num_gnn_layers:
      type: int
      low: 
      high: 
    decoder_hidden_dim:
      type: categorical
      choices: 
    dropout:
      type: float
      low: 
      high: 
    lr:
      type: float
      low: 
      high:
      log: true
    weight_decay:
      type: float
      low: 
      high: 
      log: true

inference:
  initialization_duration:  # total Dynawo run time (s) before constructing the graph, to find a steady state solution for the initial operating point